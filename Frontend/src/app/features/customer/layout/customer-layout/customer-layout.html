
<div class="customer-layout">

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

    <div class="container-fluid px-4">

      <!-- Brand -->
      <a class="navbar-brand fw-bold" routerLink="/home">

        <i class="bi bi-bag-check-fill text-primary"></i>
        ShopEase

      </a>

      <!-- Mobile Toggle -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#customerNavbar"
        aria-controls="customerNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>

      </button>

      <!-- Navigation Links -->
      <div class="collapse navbar-collapse" id="customerNavbar">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <!-- Home -->
          <li class="nav-item">

            <a
              class="nav-link"
              routerLink="/home"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }">

              <i class="bi bi-house"></i>
              Home

            </a>

          </li>

          <!-- All Products -->
          <li class="nav-item">

            <a
              class="nav-link"
              routerLink="/products"
              routerLinkActive="active">

              <i class="bi bi-grid"></i>
              All Products

            </a>

          </li>

          <!-- Categories -->
          <li class="nav-item">

            <a
              class="nav-link"
              routerLink="/categories"
              routerLinkActive="active">

              <i class="bi bi-tags"></i>
              Categories

            </a>

          </li>

        </ul>

        <!-- Right Navigation -->
        <div class="d-flex align-items-center gap-3 customer-right-nav">

          <!-- Cart -->
          <a class="nav-link" routerLink="/cart">

            <i class="bi bi-cart3"></i>
            Cart

          </a>

          <!-- My Orders -->
          <a class="nav-link" routerLink="/my-orders">

            <i class="bi bi-box-seam"></i>
            My Orders

          </a>

          <!-- User Profile Dropdown -->
          <div class="profile-container">

            <!-- Username Button -->
            <button
              type="button"
              class="btn btn-outline-primary profile-button"
              (click)="toggleProfileMenu()">

              <i class="bi bi-person-circle me-1"></i>

              {{ userName }}

              <i
                class="bi ms-2"
                [ngClass]="isProfileMenuOpen ? 'bi-chevron-up' : 'bi-chevron-down'">
              </i>

            </button>

            <!-- Dropdown Menu -->
            <div
              class="profile-dropdown"
              *ngIf="isProfileMenuOpen">

              <!-- My Profile -->
              <a
                class="dropdown-item"
                routerLink="/profile"
                (click)="closeProfileMenu()">

                <i class="bi bi-person me-2"></i>
                My Profile

              </a>

              <hr class="dropdown-divider">

              <!-- Logout -->
              <button
                type="button"
                class="dropdown-item text-danger"
                (click)="logout()">

                <i class="bi bi-box-arrow-right me-2"></i>
                Logout

              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </nav>

  <!-- Page Content -->
  <main class="customer-content">

    <router-outlet></router-outlet>

  </main>

  <!-- Footer -->
  <footer class="customer-footer">

    <p class="mb-0">
      © 2026 ShopEase. All rights reserved.
    </p>

  </footer>

</div>
