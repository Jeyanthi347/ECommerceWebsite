<div class="customer-layout">

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid px-4">

      <!-- Brand -->
      <a class="navbar-brand fw-bold" routerLink="/products">
        <i class="bi bi-bag-check-fill text-primary"></i>
        ShopEase
      </a>

      <!-- Mobile Toggle -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#customerNavbar"
        aria-controls="customerNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation Links -->
      <div class="collapse navbar-collapse" id="customerNavbar">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link"
               routerLink="/products"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }">
              <i class="bi bi-house"></i> Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               routerLink="/products"
               routerLinkActive="active">
              <i class="bi bi-grid"></i> All Products
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/categories">
              <i class="bi bi-tags"></i> Categories
            </a>
          </li>

        </ul>

        <!-- Right Navigation -->
        <div class="d-flex align-items-center gap-3">

          <a class="nav-link" routerLink="/cart">
            <i class="bi bi-cart3"></i> Cart
          </a>

          <a class="nav-link" routerLink="/my-orders">
            <i class="bi bi-box-seam"></i> My Orders
          </a>

          <div class="dropdown">
            <button
              class="btn btn-outline-primary dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false">
              <i class="bi bi-person-circle"></i>
              {{ userName }}
            </button>

            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" routerLink="/profile">
                  <i class="bi bi-person"></i> My Profile
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item text-danger" (click)="logout()">
                  <i class="bi bi-box-arrow-right"></i> Logout
                </button>
              </li>
            </ul>
          </div>

        </div>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="customer-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="customer-footer">
    <p class="mb-0">
      © 2026 ShopEase. All rights reserved.
    </p>
  </footer>

</div>
