
<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center login-background">
  <div class="card shadow-lg border-0 login-card">
    <div class="card-body p-4 p-md-5">

      <div class="text-center mb-4">
        <i class="bi bi-bag-check-fill shop-icon"></i>
        <h2 class="fw-bold mt-3">Welcome Back!</h2>
        <p class="text-muted">Login to your E-Commerce account</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>

          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-envelope"></i>
            </span>

            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="Enter your email">
          </div>

          <small class="text-danger"
            *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">
            Email is required.
          </small>

          <small class="text-danger"
            *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">
            Enter a valid email address.
          </small>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>

          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>

            <input
              type="password"
              class="form-control"
              formControlName="password"
              placeholder="Enter your password">
          </div>

          <small class="text-danger"
            *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
            Password is required.
          </small>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">
          Login
        </button>

      </form>

      <div class="text-center mt-4">
        <span class="text-muted">Don't have an account?</span>
        <a routerLink="/register" class="text-decoration-none fw-semibold">
          Register
        </a>
      </div>

    </div>
  </div>
</div>
